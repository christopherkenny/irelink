url: http://christophertkenny.com/irelink/
template:
  bootstrap: 5
  package: ctktemplate

home:
  sidebar:
    structure: [links, license, citation, authors]

articles:
  - title: "Vignettes"
    navbar: Vignettes
    contents:
      - irelink
      - deduplication
      - deduplicate-50k
      - record-linkage
      - transactions
      - from_splink
      - advanced

reference:
  - title: "Linkage Specification"
    desc: "Define the comparisons and blocking rules that drive the model."
    contents:
      - il_spec
      - il_compare
      - il_block_on
      - block_on
      - il_transform
      - il_substr
      - il_regex_extract
      - il_nullif
      - il_cast_to_string
      - il_try_parse_date
      - il_try_parse_timestamp
      - il_array_element
      - is_il_spec

  - title: "Comparison Levels"
    desc: "Building blocks for scoring how similar two records are on a given field."
    contents:
      - cl_exact
      - cl_levenshtein
      - cl_damerau_levenshtein
      - cl_jaro
      - cl_jaro_winkler
      - cl_jaccard
      - cl_cosine
      - cl_numeric_diff
      - cl_pct_diff
      - cl_date_diff
      - cl_time_diff
      - cl_distance_km
      - cl_array_intersect
      - cl_array_subset
      - cl_array_min_distance
      - cl_columns_reversed
      - cl_custom
      - cl_literal
      - cl_null
      - cl_else
      - cl_levels
      - cl_and
      - cl_or
      - cl_not

  - title: "Phonetic Transforms"
    desc: "Phonetic encoding functions for blocking and comparison on name fields."
    contents:
      - phonetic
      - cl_soundex

  - title: "Domain-Specific Comparisons"
    desc: "Pre-configured multi-level comparisons for common field types."
    contents:
      - cl_name
      - cl_first_last_name
      - cl_forename_surname
      - cl_dob
      - cl_email
      - cl_zip_code
      - cl_postcode

  - title: "Model Fitting"
    desc: "Create and train a probabilistic linkage model."
    contents:
      - il_model
      - il_estimate_u
      - il_estimate_em
      - il_estimate_prior
      - il_estimate_m_from_column
      - il_estimate_m_from_labels
      - is_il_model

  - title: "Prediction and Clustering"
    desc: "Score record pairs and resolve them into linked entities."
    contents:
      - predict.il_model
      - il_cluster
      - il_deterministic_link
      - il_find_matches
      - il_score_missing_edges

  - title: "Model Inspection"
    desc: "Examine parameters, weights, and training diagnostics."
    contents:
      - il_parameters
      - il_weights
      - il_training_history
      - autoplot.il_training_history
      - il_waterfall
      - il_compare_records
      - il_string_similarity
      - autoplot.il_string_similarity
      - il_tf_chart
      - il_comparison_vectors
      - autoplot.il_comparison_vectors
      - print.il_model
      - print.il_spec
      - summary.il_model
      - autoplot.il_model
      - autoplot.il_compared

  - title: "Evaluation"
    desc: "Assess model quality against labelled data."
    contents:
      - il_accuracy
      - il_confusion_matrix
      - il_cluster_confusion_matrix
      - labels_from_column
      - il_precision_recall
      - il_roc
      - il_errors
      - il_unlinkables
      - il_graph_metrics
      - autoplot.il_accuracy
      - autoplot.il_roc
      - autoplot.il_precision_recall
      - autoplot.il_unlinkables

  - title: "Blocking"
    desc: "Suggest and evaluate blocking rules to reduce candidate pairs."
    contents:
      - il_suggest_blocking
      - il_find_blocking_below
      - block_from_labels

  - title: "Data Profiling"
    desc: "Explore and summarise input data before linkage."
    contents:
      - il_completeness
      - autoplot.il_completeness
      - il_count_pairs
      - autoplot.il_count_pairs
      - il_largest_blocks
      - il_profile
      - autoplot.il_profile
      - il_comparator_score
      - autoplot.il_comparator_score
      - il_comparator_threshold_chart
      - il_phonetic_chart
      - il_register_tf

  - title: "Persistence and Utilities"
    desc: "Save, load, and manage linkage models and resources."
    contents:
      - il_save
      - il_load
      - il_attach
      - il_cleanup
      - irelink-package

  - title: "Datasets"
    desc: "Bundled benchmark datasets from the splink ecosystem."
    contents:
      - fake_20
      - fake_1000
      - fake_1000_labels
      - febrl4a
      - febrl4b

  - title: "Unit Helpers"
    desc: "Lightweight constructors for physical and temporal units."
    contents:
      - days
      - months
      - years
      - hours
      - minutes
      - seconds
      - km
      - mi
